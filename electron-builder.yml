appId: com.local.claudelocalbridge
productName: Conlaude
afterPack: build/windows-branding.cjs
afterAllArtifactBuild: build/windows-branding.cjs
directories:
  output: dist/Conlaude-${version}
files:
  - out/**
  - package.json
  # node-pty loads the target prebuilds; its source and postinstall copies are not runtime files.
  - '!node_modules/node-pty/{build,deps,src,scripts,third_party}/**/*'
  - '!node_modules/node-pty/prebuilds/!(win32-${arch}){,/**/*}'
  - '!node_modules/node-pty/lib/**/*.{map,test.js}'
electronLanguages:
  - en-US
  - zh-CN
extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: remote/bridge_agent.py
    to: remote/bridge_agent.py
asarUnpack:
  - node_modules/node-pty/**
npmRebuild: false
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
portable:
  artifactName: ${productName}-Portable-${version}-${arch}.${ext}
